<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interview AI Test Page</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; borderRadius: 8px; }
    label { font-weight: bold; display: block; margin-top: 15px; }
    textarea, input[type="file"] { width: 100%; margin-top: 5px; }
    textarea { height: 100px; }
    button { margin-top: 20px; padding: 10px 20px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 15px; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Interview AI Report Generator - Test Page</h2>
  <form id="testForm">
    <label>Resume PDF:</label>
    <input type="file" id="resume" name="resume" accept=".pdf" required />

    <label>Self Description:</label>
    <textarea id="selfDescription" name="selfDescription" required>I am a Full Stack Developer with experience in React and Node.js.</textarea>

    <label>Job Description:</label>
    <textarea id="jobDescription" name="jobDescription" required>Looking for a Full Stack Developer proficient in React, Node.js, and MongoDB.</textarea>

    <button type="submit" id="btn">Generate Report</button>
  </form>

  <h3>Response:</h3>
  <pre id="output">Output will appear here...</pre>

  <script>
    document.getElementById("testForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const output = document.getElementById("output");
      const btn = document.getElementById("btn");
      output.textContent = "Generating report using Gemini AI... Please wait...";
      btn.disabled = true;

      const formData = new FormData();
      formData.append("resume", document.getElementById("resume").files[0]);
      formData.append("selfDescription", document.getElementById("selfDescription").value);
      formData.append("jobDescription", document.getElementById("jobDescription").value);

      try {
        const res = await fetch("/api/interview/", {
          method: "POST",
          body: formData
        });
        const data = await res.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = "Error: " + err.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
